<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#0f1115">
<title>Lift</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>

  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --line: #2a2e38;
    --text: #f2f3f5;
    --muted: #8b919e;
    --accent: #3ddc84;
    --warn: #f5a524;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  header { margin-bottom: 16px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .flex { width: 44px; height: 44px; color: var(--accent); flex-shrink: 0; }
  .day { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
  .sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .25s; }
  main { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--muted); margin-bottom: 10px; }
  .tag.skipped { color: var(--warn); margin-left: 8px; }
  .ex + .ex { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
  .ex-name { font-size: 26px; font-weight: 700; line-height: 1.15; }
  .ex-reps { font-size: 18px; margin-top: 6px; }
  .ex-note { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .next { color: var(--muted); font-size: 15px; padding: 0 4px; }
  .next b { color: var(--text); font-weight: 600; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  button { font: inherit; border: 0; border-radius: 14px; padding: 18px; font-size: 19px; font-weight: 700; cursor: pointer; }
  .primary { background: var(--accent); color: #062b15; }
  .secondary { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .secondary:disabled { opacity: .35; }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    margin-top: 18px; font-size: 14px; color: var(--muted); }
  .link { background: none; padding: 6px 0; font-size: 14px; font-weight: 500; color: var(--muted); }
  .link:disabled { opacity: .35; }
  select { font: inherit; font-size: 14px; background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
  .done { text-align: center; padding: 40px 20px; }
  .done .big { font-size: 64px; }
  .done h2 { font-size: 28px; margin: 12px 0 6px; }
  .done p { color: var(--muted); margin: 0; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px; }
  .tile .num { font-size: 28px; font-weight: 800; }
  .tile .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .sec { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 6px 4px -4px; }
  .rows { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .l { font-size: 15px; }
  .row .l small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row .r { font-size: 15px; font-weight: 700; white-space: nowrap; text-align: right; }
  .row .r small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .up { color: var(--accent); } .down { color: #ff6b6b; }
  .empty { color: var(--muted); text-align: center; padding: 24px 10px; }
  .last { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .last b { color: var(--text); font-weight: 600; }
  .sets { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .set { display: grid; grid-template-columns: 52px 1fr 18px 1fr; align-items: center; gap: 8px; }
  .set-label { font-size: 14px; color: var(--muted); font-weight: 600; }
  .set .x { text-align: center; color: var(--muted); }
  .field { position: relative; }
  .field input { width: 100%; font: inherit; font-size: 20px; font-weight: 600; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 40px 12px 12px; }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field input::placeholder { color: #4b505c; }
  .field span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; color: var(--muted); pointer-events: none; }
  footer { flex-wrap: wrap; }
  .syncline { width: 100%; text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .syncline .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--muted); vertical-align: 1px; }
  .syncline.ok .dot { background: var(--accent); }
  .syncline.wait .dot { background: var(--warn); }
  .syncline.err .dot { background: #ff6b6b; }
  .login p { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 6px 0 16px; }
  .login input, .bw input { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .login input:focus, .bw input:focus { outline: none; border-color: var(--accent); }
  .msg { font-size: 14px; color: var(--muted); margin-top: 10px; min-height: 1em; }
  .msg.bad { color: #ff6b6b; }
  .login form { margin: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px; margin-bottom: 14px; }
  .seg button { background: none; color: var(--muted); padding: 10px; font-size: 15px; border-radius: 9px; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .gbtn { width: 100%; background: #fff; color: #1f1f1f; font-size: 17px; padding: 15px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 16px 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .bw { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
  .bw input { margin: 0; }
  .bw button { padding: 14px 18px; font-size: 16px; }
  .install-mini-wrap { display: flex; justify-content: flex-end; margin-top: 12px; }
  .install-mini { width: 44px; height: 44px; padding: 0; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line); background: var(--card); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .install-mini img { display: block; width: 100%; height: 100%; }
  .install { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; margin-top: 14px; }
  .install img { width: 40px; height: 40px; border-radius: 10px; }
  .install .t { flex: 1; font-size: 14px; line-height: 1.3; }
  .install .t b { display: block; font-size: 15px; }
  .install .t span { color: var(--muted); }
  .install .go { padding: 10px 14px; font-size: 15px; }
  .install .x { background: none; color: var(--muted); padding: 6px; font-size: 20px; font-weight: 400; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; z-index: 10; }
  .sheet { width: 100%; background: var(--card); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0;
    padding: 22px 20px max(22px, env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 14px; font-size: 22px; }
  .sheet ol { margin: 0 0 18px; padding-left: 22px; font-size: 17px; line-height: 1.7; }
  .sheet .share { display: inline-block; vertical-align: -4px; width: 20px; height: 20px; color: #4da3ff; }
  .sheet .hint { color: var(--muted); font-size: 14px; margin: -8px 0 16px; }
  .sheet button { width: 100%; }
  .pointer { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 34px; z-index: 11;
    animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(-50%, -8px); } }
  .backup .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .backup .row2 button { padding: 14px 10px; font-size: 16px; }
  .nudge { background: rgba(245,165,36,.1); border: 1px solid rgba(245,165,36,.35); border-radius: 14px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .nudge span { flex: 1; }
  .nudge button { padding: 10px 14px; font-size: 15px; }
  .tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tpl { text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 12px; font-size: 15px; font-weight: 700; }
  .tpl span { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 4px; line-height: 1.3; }
  .tpl.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .hint { font-size: 13px; color: var(--muted); padding: 0 4px; line-height: 1.4; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .daychip { background: var(--bg); color: var(--muted); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 0 8px; font-size: 18px; font-weight: 800; }
  .daychip small { display: block; font-size: 10px; font-weight: 600; margin-top: 2px; }
  .daychip.on { background: var(--accent); color: #062b15; border-color: var(--accent); }
  .stepper-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 44px; height: 44px; padding: 0; font-size: 22px; background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .stepper b { font-size: 22px; min-width: 20px; text-align: center; }
  .wrow { padding: 6px 0; }
  .wopen { flex: 1; background: none; color: var(--text); text-align: left; padding: 6px 0; font-size: 15px; font-weight: 400; }
  .wopen .l small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .mini { display: flex; gap: 6px; }
  .mini button { width: 38px; height: 38px; padding: 0; font-size: 16px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; }
  .mini button:disabled { opacity: .3; }
  .addbtn { width: 100%; padding: 14px; font-size: 16px; }
  .eblock { display: flex; flex-direction: column; gap: 10px; }
  .ehead { display: flex; justify-content: space-between; align-items: center; }
  .eitem { display: flex; flex-direction: column; gap: 6px; }
  .eitem + .eitem { border-top: 1px solid var(--line); padding-top: 12px; }
  .egrid { display: grid; grid-template-columns: 1fr 90px; gap: 10px; }
  .lbl { font-size: 12px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }
  .tin { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; }
  .tin.big { font-size: 18px; font-weight: 700; }
  .tin:focus { outline: none; border-color: var(--accent); }
  .rlist { display: flex; flex-direction: column; gap: 10px; }
  .rcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .rcard.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .rcard.ask { border-color: var(--warn); }
  .rpick { display: block; width: 100%; text-align: left; background: none; color: var(--text); padding: 14px 16px 6px; font-weight: 400; border-radius: 0; }
  .rtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rname { font-size: 18px; font-weight: 800; }
  .rmeta { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .rcheck { background: var(--accent); color: #062b15; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .rtag { border: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .rconfirm { margin: 6px 16px 4px; padding: 12px; background: rgba(245,165,36,.1); border-radius: 12px; font-size: 14px; }
  .rconfirm .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .rconfirm button { padding: 12px; font-size: 16px; }
  .rlinks { display: flex; gap: 18px; padding: 0 16px 10px; }
  .rlinks .link { font-size: 13px; padding: 4px 0; }
  .daychip.taken { color: #5b616e; border-style: dashed; }
  .daychip.taken small { color: var(--warn); }
  .wcard .days { margin-bottom: 12px; }
  button.small { width: 100%; padding: 12px; font-size: 15px; }
  .exname { font-size: 18px; font-weight: 700; }
  .exrow { width: 100%; background: none; color: var(--text); font-weight: 400; border-radius: 0; padding: 13px 0; text-align: left; }
  .exrow .r { color: var(--accent); font-size: 20px; font-weight: 700; }
  select.tin { appearance: none; -webkit-appearance: none; }
  .acct { position: relative; display: flex; justify-content: flex-start; margin: -4px 0 8px; }
  .acct-btn { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 10px; font-size: 13px; font-weight: 600; }
  .acct-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(61,220,132,.18); }
  .acct-dot.off { background: var(--muted); box-shadow: none; }
  .acct-dot.wait { background: var(--warn); box-shadow: 0 0 0 3px rgba(245,165,36,.18); }
  .acct-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 62vw; }
  .acct-caret { color: var(--muted); font-size: 11px; }
  .acct-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 240px; max-width: calc(100vw - 32px);
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .acct-who { padding: 10px 10px 2px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .acct-who b { color: var(--text); display: block; font-size: 15px; margin-top: 2px; }
  .acct-sync { padding: 2px 10px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .acct-item { display: block; width: 100%; text-align: left; background: none; color: var(--text); padding: 12px 10px; font-size: 15px;
    font-weight: 600; border-radius: 10px; }
  .acct-item.danger { color: #ff6b6b; }
  .small-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <div class="acct" id="acct" hidden>
    <button class="acct-btn" id="acctBtn" aria-haspopup="true" aria-expanded="false">
      <span class="acct-dot" id="acctDot"></span><span class="acct-email" id="acctEmail"></span><span class="acct-caret">▾</span>
    </button>
    <div class="acct-menu" id="acctMenu" hidden>
      <div class="acct-who" id="acctWho"></div>
      <div class="acct-sync" id="acctSync"></div>
      <button class="acct-item" id="acctDash">📊 Dashboard</button>
      <button class="acct-item danger" id="acctSignOut">Sign out</button>
    </div>
  </div>
  <div class="top">
    <div class="day" id="day"></div>
    <svg class="flex" viewBox="0 0 64 64" aria-hidden="true">
      <path fill="currentColor" d="M2 35 C7 23 28 19 37 34 C38 30 39.5 26 41 23 L36 23 C33.5 23 32 21.5 32 19.5 C32 17.8 33 16.6 34.3 16.3 C32.8 15.8 32 14.6 32 13.4 C32 12 33 11 34.3 10.8 C33 10.2 32.4 9.2 32.6 8 C33 5.8 35.6 4.6 39 4.6 L46 4.6 C50 4.6 53 7.6 52.6 11.5 L51.6 21.5 L58 46 C60 54 55 59 48 59 L2 59 Z"/>
      <g fill="none" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round"><path d="M35.5 19.8 Q41 20.6 45 16.5"/><path d="M37 34 Q40.5 42 39 51"/></g>
      <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M13 14 l2 4"/><path d="M20 11 v5"/><path d="M7 19 l3 3"/></g>
    </svg>
  </div>
  <div class="sub" id="sub"></div>
  <div class="bar" id="barwrap"><div id="bar"></div></div>
</header>
<main id="main"></main>
<div class="install" id="install" hidden>
  <img src="icon-192.png" alt="">
  <div class="t"><b>Install Lift</b><span>Open it from your home screen like an app</span></div>
  <button class="primary go" id="installGo">Install</button>
  <button class="x" id="installX" aria-label="Collapse">×</button>
</div>
<div class="install-mini-wrap" id="installMiniWrap" hidden>
  <button class="install-mini" id="installMini" aria-label="Install Lift" title="Install Lift"><img src="icon-192.png" alt=""></button>
</div>
<div id="sheetHost"></div>
<footer>
  <button class="link" id="undo">↩ Undo</button>
  <select id="pick" aria-label="Change workout"></select>
  <button class="link" id="restart">Restart day</button>
  <button class="link" id="export">⬇ Export log</button>
  <button class="link" id="dashLink">📊 Dashboard</button>
  <button class="link" id="footSignOut" hidden>Sign out</button>
  <div class="syncline" id="sync"></div>
</footer>

<!-- Database keys live in config.js. Leave them blank to keep everything on this phone only. -->
<script src="config.js" onerror="window.LIFT_CONFIG = window.LIFT_CONFIG || {}"></script>
<script>
// =============================================================================
// BUILT-IN ROUTINES (starter workouts). Edit these to change the defaults.
// Each block = one screen. Two exercises in a block = superset (alternate them).
// =============================================================================
const x = (n, r, note = "") => ({ n, r, note });
const HEAVY = "Stop 1 rep shy · rest 2–3 min", MID = "To failure · rest 2 min", ISO = "To failure · rest 90 sec";

const TEMPLATES = {
  "upper-lower": { label: "Upper / Lower", blurb: "4 days · each muscle 2× a week", days: [1, 2, 4, 5], workouts: [
    { name: "Upper A", blocks: [
      [x("Flat barbell bench", "6–10", HEAVY)], [x("Chest-supported row", "8–12", "Neutral grip · " + MID)],
      [x("Neutral-grip lat pulldown", "10–12", MID)], [x("Cable flyes", "12–15", ISO)], [x("Lateral raises", "12–15", ISO)],
      [x("Hammer curls", "10–12", "To failure"), x("Rope pushdowns", "10–12", "To failure")] ] },
    { name: "Lower A", blocks: [
      [x("Back squat", "6–10", HEAVY)], [x("Romanian deadlift", "8–10", HEAVY)], [x("Leg press", "10–15", MID)],
      [x("Lying leg curl", "10–12", ISO)], [x("Standing calf raise", "12–15", "To failure · rest 60–90 sec")],
      [x("Hanging knee raise", "12–15", "To failure · rest 60–90 sec")] ] },
    { name: "Upper B", blocks: [
      [x("Incline barbell bench", "6–10", HEAVY)], [x("Neutral-grip pull-ups", "6–10", MID)], [x("Flat DB press", "8–12", MID)],
      [x("One-arm DB row", "10–12 each", ISO)], [x("Cable flyes", "12–15", ISO)], [x("Military press", "6–10", "Stop 1 rep shy · rest 2 min")],
      [x("Lateral raises", "12–15", "To failure · rest 60–90 sec")], [x("Face pulls", "15", "To failure · rest 60–90 sec")],
      [x("Rope hammer curls", "10–12", "To failure"), x("Overhead cable triceps ext.", "10–12", "To failure")] ] },
    { name: "Lower B", blocks: [
      [x("Trap-bar deadlift", "6–10", HEAVY)], [x("Bulgarian split squat", "8–10 each", "Rest 2 min")], [x("Hip thrust", "8–12", MID)],
      [x("Seated leg curl", "10–12", ISO)], [x("Leg extension", "12–15", ISO)], [x("Seated calf raise", "12–15", "To failure · rest 60–90 sec")] ] },
  ] },
  "ppl": { label: "Push / Pull / Legs", blurb: "3 days, or 6 to run it twice", days: [1, 3, 5], workouts: [
    { name: "Push", blocks: [
      [x("Flat barbell bench", "6–10", HEAVY)], [x("Incline DB press", "8–12", MID)], [x("Military press", "6–10", HEAVY)],

// =============================================================================
// ROUTINES
// A routine = { id, name, sets, workouts: [{ name, days: [weekdays], blocks }] }
//   blocks:   [[exercise], [exercise, exercise]]  — 2+ exercises in a block = superset
//   exercise: { n: name, r: reps, note, sets? }   — sets falls back to routine.sets
// The app goes through the routine's training days in week order (Mon → Sun),
// doing whichever workout is assigned to each day. Missed days don't skip anything.
//
// Everything the user owns is one "store", saved on the phone and (signed in) in the database:
//   { v: 3, selected: routine id, custom: [routines they made], exercises: [{ n, g }] }
// =============================================================================
function defaultRoutine(key) {
  const t = TEMPLATES[key];
  return { id: "default:" + key, name: t.label, builtin: true, sets: t.sets || 2,
           workouts: t.workouts.map((w, i) => ({ name: w.name, days: [...DEFAULT_DAYS[key][i]], blocks: clone(w.blocks) })) };
}
const emptyStore = () => ({ v: 3, selected: "default:upper-lower", custom: [], exercises: [] });

function validBlocks(bs) {
  return Array.isArray(bs) && bs.length > 0 &&
    bs.every(b => Array.isArray(b) && b.length > 0 && b.every(e => e && typeof e.n === "string" && e.n.trim() && typeof e.r === "string"));
}
const cleanDays = ds => Array.isArray(ds) ? sortDays([...new Set(ds.filter(d => Number.isInteger(d) && d >= 0 && d <= 6))]) : [];
function fixRoutine(r) {
  if (!r || typeof r.name !== "string" || !r.name.trim() || !Array.isArray(r.workouts) || !r.workouts.length) return null;
  if (!r.workouts.every(w => w && typeof w.name === "string" && w.name.trim() && validBlocks(w.blocks))) return null;
  const sets = Number.isInteger(r.sets) && r.sets >= 1 && r.sets <= 10 ? r.sets : 2;
  const taken = new Set();
  const workouts = r.workouts.map(w => {
    const days = cleanDays(w.days).filter(d => !taken.has(d));   // one workout per day
    days.forEach(d => taken.add(d));
    return { name: w.name.trim(), days, blocks: w.blocks };
  });
  return { id: typeof r.id === "string" && r.id && !r.id.startsWith("default:") ? r.id : "r-" + uid(), name: r.name.trim(), sets, workouts };
}
// Spread old-style plans (one list of days for the whole plan) across their workouts
function daysRoundRobin(days, n) {
  const out = Array.from({ length: n }, () => []);
  sortDays(days).forEach((d, k) => out[k % n].push(d));
  return out;
}
const sameBlocks = (a, b) => JSON.stringify(a.map(w => [w.name, w.blocks])) === JSON.stringify(b.map(w => [w.name, w.blocks]));

// Accepts the current store, or plans saved by older versions of the app
function normalizeStore(p) {
  if (p && p.v === 3) {
    const custom = (Array.isArray(p.custom) ? p.custom : []).map(fixRoutine).filter(Boolean);
    const exercises = (Array.isArray(p.exercises) ? p.exercises : [])
      .filter(e => e && typeof e.n === "string" && e.n.trim()).map(e => ({ n: e.n.trim(), g: typeof e.g === "string" && e.g ? e.g : "My exercises" }));
    const s = { v: 3, selected: p.selected, custom, exercises };
    if (!routineIn(s, s.selected)) s.selected = "default:upper-lower";
    return s;
  }
  let old = null;
  if (Array.isArray(p) && p.every(w => w && w.name && validBlocks(w.blocks))) {         // v1: array with day names
    old = { workouts: p.map(w => ({ name: w.name, blocks: w.blocks, days: [DAY_FULL.indexOf(w.when)].filter(d => d >= 0) })) };
  } else if (p && typeof p === "object" && Array.isArray(p.workouts) && p.workouts.every(w => w && w.name && validBlocks(w.blocks))) {   // v2
    const rr = daysRoundRobin(cleanDays(p.days).length ? cleanDays(p.days) : [1, 3, 5], p.workouts.length);
    if (TEMPLATES[p.template] && DEFAULT_DAYS[p.template] && sameBlocks(p.workouts, TEMPLATES[p.template].workouts)) {
      return { ...emptyStore(), selected: "default:" + p.template };
    }
    old = { sets: p.sets, workouts: p.workouts.map((w, i) => ({ name: w.name, blocks: w.blocks, days: rr[i] })) };
  }
  if (!old) return null;
  if (sameBlocks(old.workouts, TEMPLATES["upper-lower"].workouts) && old.workouts.every((w, i) => JSON.stringify(cleanDays(w.days)) === JSON.stringify(DEFAULT_DAYS["upper-lower"][i]))) {
    return emptyStore();
  }
  const mine = fixRoutine({ name: "My plan", sets: old.sets, workouts: old.workouts });
  return mine ? { ...emptyStore(), selected: mine.id, custom: [mine] } : null;
}
const allRoutinesIn = s => DEFAULT_ORDER.map(defaultRoutine).concat(s.custom);
const routineIn = (s, id) => allRoutinesIn(s).find(r => r.id === id) || null;

// Training days in week order → which workout each one is
function slotsOf(r) {
  const s = [];
  DAY_ORDER.forEach(d => { const w = r.workouts.findIndex(x => (x.days || []).includes(d)); if (w >= 0) s.push({ d, w }); });
  r.workouts.forEach((x, i) => { if (!(x.days || []).length) s.push({ d: null, w: i }); });   // no day picked: still in the rotation
  return s;
}
function whenOf(i, r = PLANCFG) {
  const ds = sortDays((r.workouts[i] && r.workouts[i].days) || []);
  return ds.length === 1 ? DAY_FULL[ds[0]] : ds.map(d => DAY_SHORT[d]).join(" & ");
}

  const ds = sortDays([...new Set(r.workouts.flatMap(w => w.days || []))]);

};

const lsGet = (k, fallback) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fallback; } catch (e) { return fallback; } };

// =============================================================================
// DATA LAYER
// Every table is cached on the phone (so the app works offline) and, when the
// database is configured, changes are queued and pushed to Supabase.
//   sets        id, session_id, logged_at, date, workout, exercise, set_number, weight_lb, reps
//   bodyweight  id, logged_at, date, weight_lb
// =============================================================================
const CFG = window.LIFT_CONFIG || {};
const CONFIGURED = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
let sb = null;          // Supabase client once loaded
let user = null;        // signed-in user
let skipLogin = lsGet("lift-skip-login", false); // chose "continue without an account" (remembered)

function makeTable(name, key, fields, sortFn) {
  const pk = key + "-pending", dk = key + "-deleted";
  const clean = r => { const o = {}; fields.forEach(f => { o[f] = r[f] ?? null; }); return o; };
  return {
    name,
    all: () => lsGet(key, []),
    add(recs) {
      lsSet(key, lsGet(key, []).concat(recs).sort(sortFn));
      if (CONFIGURED) lsSet(pk, lsGet(pk, []).concat(recs));
      Sync.push();
    },
    remove(ids) {
      const drop = new Set(ids);
      lsSet(key, lsGet(key, []).filter(r => !drop.has(r.id)));
      if (CONFIGURED) {
        const pend = lsGet(pk, []);
        const neverSent = new Set(pend.filter(r => drop.has(r.id)).map(r => r.id));
        lsSet(pk, pend.filter(r => !drop.has(r.id)));
        lsSet(dk, lsGet(dk, []).concat(ids.filter(i => !neverSent.has(i))));
      }
      Sync.push();
    },
    pending: () => lsGet(pk, []).length + lsGet(dk, []).length,
    queueAllLocal() {                       // one-time import of data logged before the DB existed
      const have = new Set(lsGet(pk, []).map(r => r.id));
      lsSet(pk, lsGet(pk, []).concat(lsGet(key, []).filter(r => !have.has(r.id))));
    },
    async flush() {
      const adds = lsGet(pk, []), dels = lsGet(dk, []);
      for (let i = 0; i < adds.length; i += 500) {
        const chunk = adds.slice(i, i + 500).map(clean);
        const { error } = await sb.from(name).upsert(chunk, { onConflict: "id" });
        if (error) throw error;
        const sent = new Set(chunk.map(r => r.id));
        lsSet(pk, lsGet(pk, []).filter(r => !sent.has(r.id)));
      }
      if (dels.length) {
        const { error } = await sb.from(name).delete().in("id", dels);
        if (error) throw error;
        const gone = new Set(dels);
        lsSet(dk, lsGet(dk, []).filter(i => !gone.has(i)));
      }
    },
    async pull() {                          // database is the source of truth; keep anything not sent yet
      const rows = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await sb.from(name).select(fields.join(",")).order("logged_at", { ascending: true }).range(from, from + 999);
        if (error) throw error;
        rows.push(...data);
        if (data.length < 1000) break;
      }
      const pend = lsGet(pk, []), dels = new Set(lsGet(dk, []));
      const onServer = new Set(rows.map(r => r.id));
      const merged = rows.filter(r => !dels.has(r.id)).map(r => {
        const o = clean(r);
        if (o.weight_lb != null) o.weight_lb = Number(o.weight_lb);
        return o;
      }).concat(pend.filter(r => !onServer.has(r.id)));
      merged.sort(sortFn);
      lsSet(key, merged);
    },
  };
}
const byTime = (a, b) => String(a.logged_at).localeCompare(String(b.logged_at));
const Sets = makeTable("sets", "lift-log-v1",
  ["id", "session_id", "logged_at", "date", "workout", "exercise", "set_number", "weight_lb", "reps"],
  (a, b) => (new Date(a.logged_at) - new Date(b.logged_at)) || (a.set_number - b.set_number));
const Bodyweight = makeTable("bodyweight", "lift-bw-v1", ["id", "logged_at", "date", "weight_lb"], byTime);
const TABLES = [Sets, Bodyweight];

const Sync = {
  state: "local", busy: false, again: false, lastPull: 0,
  online: () => navigator.onLine !== false,
  ready() { return !!(sb && user); },
  async push() {
    if (!this.ready() || !this.online()) return this.show();
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try { for (const t of TABLES) await t.flush(); this.state = "ok"; }
    catch (e) { console.warn("Sync push failed", e); this.state = "err"; }
    this.busy = false; this.show();
    if (this.again) { this.again = false; this.push(); }
  },
  async full() {                            // push anything waiting, then pull everything down
    if (!this.ready() || !this.online()) return this.show();
    await this.push();
    if (this.state === "err") return;
    try {
      for (const t of TABLES) await t.pull();
      await pullPlan();
      this.state = "ok"; this.lastPull = Date.now();
    } catch (e) { console.warn("Sync pull failed", e); this.state = "err"; }
    this.show();
    const typing = document.activeElement && document.activeElement.tagName === "INPUT";
    if (!typing) render();
  },
  show() {
    const el = $("sync"); if (!el) return;
    const waiting = TABLES.reduce((n, t) => n + t.pending(), 0);
    let cls = "", txt = "Saved on this phone only";
    if (CONFIGURED) {
      if (!user) { cls = waiting ? "wait" : ""; txt = waiting ? `${waiting} waiting · sign in to sync` : "Not signed in · saving on this phone"; }
      else if (!this.online()) { cls = "wait"; txt = waiting ? `Offline · ${waiting} waiting to sync` : "Offline · will sync later"; }
      else if (this.state === "err") { cls = "err"; txt = `Sync problem · ${waiting} waiting · will retry`; }
      else if (waiting) { cls = "wait"; txt = `Syncing ${waiting}…`; }
      else { cls = "ok"; txt = "Synced"; }
    }
    el.className = "syncline " + cls;
    el.innerHTML = `<span class="dot"></span>${esc(txt)}`;
    if ($("acct")) updateAcct();
  },
};

// Plan stored in the database (one row per user, table user_plan)
// Edited here and not saved yet → push it. Otherwise the database copy wins.
// First sign-in with no plan in the database → upload this phone's plan.
async function pullPlan() {
  if (lsGet(PLAN_DIRTY, false)) return savePlanToDb();
  const { data, error } = await sb.from("user_plan").select("plan").maybeSingle();
  if (error) throw error;
  const s = data && normalizeStore(data.plan);
  if (s) { STORE = s; lsSet(PLAN_KEY, STORE); applyRoutine(); }
  else if (!data) await savePlanToDb();
}
async function savePlanToDb() {
  const { error } = await sb.from("user_plan").upsert({ plan: STORE, updated_at: new Date().toISOString() }, { onConflict: "user_id" });
  if (error) throw error;
  lsSet(PLAN_DIRTY, false);
}
// Re-read the selected routine. If the workout in progress changed, it restarts.
function applyRoutine() {
  const before = state && PLAN[state.day] ? JSON.stringify(PLAN[state.day]) : null;
  PLANCFG = routineIn(STORE, STORE.selected) || routineIn(STORE, "default:upper-lower");
  PLAN = PLANCFG.workouts; SLOTS = slotsOf(PLANCFG);
  if (!state) return;
  const ok = SLOTS[state.slot] && SLOTS[state.slot].w === state.day && PLAN[state.day] &&
             state.queue.every(i => i < PLAN[state.day].blocks.length) && JSON.stringify(PLAN[state.day]) === before;
  if (!ok) { state = fresh(SLOTS[state.slot] ? state.slot : 0); save(); }
}
// Save the store on this phone (and the database when signed in)
function saveStore() {
  lsSet(PLAN_KEY, STORE);
  lsSet(PLAN_DIRTY, CONFIGURED);
  applyRoutine();
  if (Sync.ready() && Sync.online()) savePlanToDb().then(() => Sync.show()).catch(e => console.warn("Routine sync failed", e));
}
function selectRoutine(id) {
  if (STORE.selected === id || !routineIn(STORE, id)) return;
  STORE.selected = id;
  saveStore();
  state = fresh(0); save();
}

// Load Supabase only when keys are set, without blocking the app from opening
function initDb() {
  if (!CONFIGURED) return Sync.show();
  const start = () => {
    try {
      sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      });
    } catch (e) { console.warn("Supabase init failed", e); return Sync.show(); }
    sb.auth.onAuthStateChange((_evt, session) => {
      const was = user && user.id;
      user = session ? session.user : null;
      if (user && user.id !== was) onSignedIn();
      if (!user) { Sync.show(); render(); }
    });
    sb.auth.getSession().then(({ data }) => {
      const was = user && user.id;
      user = data && data.session ? data.session.user : null;
      if (user && user.id !== was) onSignedIn(); else { Sync.show(); render(); }
    });
  };
  if (window.supabase && window.supabase.createClient) return start();
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
  s.onload = start;
  s.onerror = () => { console.warn("Could not load Supabase (offline?)"); Sync.show(); };
  document.head.appendChild(s);
}
// Data on this phone belongs to whoever last signed in here. If a different
// account signs in, start it clean instead of mixing in the last person's lifts.
function clearLocalData() {
  ["lift-log-v1", "lift-bw-v1"].forEach(k => ["", "-pending", "-deleted"].forEach(s => { try { localStorage.removeItem(k + s); } catch (e) {} }));
  [PLAN_KEY, PLAN_DIRTY, KEY].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  STORE = emptyStore(); state = null; applyRoutine(); state = fresh(0); save();
}
function onSignedIn() {
  const owner = lsGet("lift-owner", null);
  if (owner && owner !== user.id) clearLocalData();
  lsSet("lift-owner", user.id);
  lsSet("lift-skip-login", false); skipLogin = false;
  const flag = "lift-imported-" + user.id;
  if (!lsGet(flag, false)) { TABLES.forEach(t => t.queueAllLocal()); lsSet(flag, true); }
  render();
  Sync.full();
}

window.addEventListener("offline", () => Sync.show());
document.addEventListener("visibilitychange", () => {

// =============================================================================
let state;
let view = "workout"; // "workout" | "dashboard"
function fresh(slot) {
  slot = SLOTS[slot] ? slot : 0;
  const day = SLOTS[slot].w;
  return { slot, day, session: uid(), queue: PLAN[day].blocks.map((_, i) => i), skipped: [], history: [], draft: {} };
}
function load() {
  const s = lsGet(KEY, null);
  if (s && PLAN[s.day] && Array.isArray(s.queue) && s.queue.every(i => i < PLAN[s.day].blocks.length)) {
    if (!SLOTS[s.slot] || SLOTS[s.slot].w !== s.day) s.slot = Math.max(0, SLOTS.findIndex(x => x.w === s.day));
    s.draft = s.draft || {}; s.session = s.session || uid(); s.history = s.history || []; s.skipped = s.skipped || [];
    return s;
  }
  return fresh(0);
}
function save() { lsSet(KEY, state); }
function snapshot(extra) {
  state.history.push({ queue: [...state.queue], skipped: [...state.skipped], draft: { ...state.draft }, ...extra });
  if (state.history.length > 30) state.history.shift();
}
const blockTitle = b => b.map(e => e.n).join(" + ");
const dkey = (blockIdx, exIdx, set) => `${blockIdx}|${exIdx}|${set}`;

// Sets from the last time this exercise was done in THIS workout (e.g. Upper A), not counting today
function lastTime(exName, workout) {
  const log = Sets.all().filter(r => r.exercise === exName && r.workout === workout && r.session_id !== state.session);
  if (!log.length) return null;
  const lastSession = log[log.length - 1].session_id;
  const sets = log.filter(r => r.session_id === lastSession).sort((a, b) => a.set_number - b.set_number);
  return { date: sets[0].date, sets };
}

function renderLogin() {

  const msg = (t, bad) => { const m = $("msg"); if (!m) return; m.textContent = t; m.className = "msg" + (bad ? " bad" : ""); };
  const friendly = e => {
    const m = (e && e.message) || String(e);
    if (/invalid login credentials/i.test(m)) return "Wrong email or password.";
    if (/already registered|already exists/i.test(m)) return "That email already has an account. Sign in instead.";
    if (/email not confirmed/i.test(m)) return "This account still needs its email confirmed.";
    if (/password should be at least/i.test(m)) return "Password needs to be at least 6 characters.";
    if (/valid email|invalid.*email/i.test(m)) return "That email doesn't look right.";
    if (/provider is not enabled/i.test(m)) return "Google sign-in isn't turned on yet.";
    if (/failed to fetch|network/i.test(m)) return "Can't reach the server. Check your connection.";
    return m;
  };

  $("tabUp").onclick = () => { authMode = "signup"; render(); };
  $("authForm").onsubmit = async ev => {

    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return msg("Enter your email.", true);
    if (!password) return msg("Enter your password.", true);
    if (signup && password.length < 6) return msg("Password needs to be at least 6 characters.", true);
    lsSet("lift-email", email);
    $("authGo").disabled = true;
    msg(signup ? "Creating your account…" : "Signing in…");
    try {
      const res = signup
        ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } })
        : await sb.auth.signInWithPassword({ email, password });
      if (res.error) throw res.error;
      if (signup && !(res.data && res.data.session)) {
        if (res.data && res.data.user && Array.isArray(res.data.user.identities) && res.data.user.identities.length === 0) {
          throw new Error("User already registered");
        }
        authMode = "signin"; render();
        return msg("Account created. Confirm it from the email we sent, then sign in.");
      }
      msg("");   // signed in: the auth listener takes it from here
    } catch (e) {
      msg(friendly(e), true);
      if ($("authGo")) $("authGo").disabled = false;
    }
  };

    msg("Opening Google…");

  };
  $("skipLogin").onclick = () => { skipLogin = true; lsSet("lift-skip-login", true); render(); };
}

const e1rm = r => (r.weight_lb || 0) * (1 + (r.reps || 0) / 30); // Epley estimate, for ranking sets

function renderDashboard() {
  const log = Sets.all();
  const bw = Bodyweight.all();
  $("day").textContent = "Dashboard";
  $("sub").textContent = "Your lifting history";
  $("barwrap").style.display = "none";
  $("undo").disabled = true;

  // Sessions (in order)
  const sessions = [];
  log.forEach(r => {
    let s = sessions.find(x => x.id === r.session_id);
    if (!s) sessions.push(s = { id: r.session_id, date: r.date, workout: r.workout, sets: 0, exercises: new Set() });
    s.sets++; s.exercises.add(r.exercise);
  });

  // This week = since Monday
  const now = new Date(); const monday = new Date(now);
  monday.setHours(0, 0, 0, 0); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const thisWeek = sessions.filter(s => new Date(s.date + "T00:00:00") >= monday).length;

  // Per-exercise: best set ever + trend vs previous session
  const order = [];
  PLAN.forEach(p => p.blocks.flat().forEach(e => { if (!order.includes(e.n)) order.push(e.n); }));
  log.forEach(r => { if (!order.includes(r.exercise)) order.push(r.exercise); });
  const bests = order.map(name => {
    const rows = log.filter(r => r.exercise === name && r.weight_lb != null && r.reps != null);
    if (!rows.length) return null;
    const best = rows.reduce((a, b) => e1rm(b) > e1rm(a) ? b : a);
    const sids = [...new Set(rows.map(r => r.session_id))];
    const topOf = sid => Math.max(...rows.filter(r => r.session_id === sid).map(e1rm));
    let trend = "";
    if (sids.length > 1) {
      const a = topOf(sids[sids.length - 1]), b = topOf(sids[sids.length - 2]);
      trend = a > b ? '<span class="up">▲</span>' : a < b ? '<span class="down">▼</span>' : '<span>＝</span>';

    return { name, best, trend, last: rows[rows.length - 1] };

  // Bodyweight: latest, change vs ~1 week ago and vs first entry

      <div class="tile"><div class="num">${thisWeek}<span style="font-size:16px;color:var(--muted)">/${SLOTS.length}</span></div><div class="lbl">This week</div></div>
      <div class="tile"><div class="num">${latest ? latest.weight_lb : "–"}</div><div class="lbl">Bodyweight (lb)</div></div>
    </div>

    ${routineSectionHtml()}

    <div class="sec">Bodyweight</div>
    <div class="card">
      <div class="bw">
        <input id="bwInput" type="number" inputmode="decimal" step="0.1" min="0" placeholder="${todayEntry ? todayEntry.weight_lb : "Today's weight (lb)"}">
        <button class="primary" id="bwSave">${todayEntry ? "Update" : "Log"}</button>
      </div>
      ${latest ? `<div class="last" style="margin-top:12px">
        Latest <b>${latest.weight_lb} lb</b> (${esc(shortDate(latest.date))})
        ${weekRef ? ` · 7 days: <b>${delta(latest.weight_lb, weekRef.weight_lb)}</b>` : ""}
        ${bwSorted.length > 1 ? ` · since ${esc(shortDate(bwSorted[0].date))}: <b>${delta(latest.weight_lb, bwSorted[0].weight_lb)}</b>` : ""}
      </div>` : `<div class="last" style="margin-top:12px">Log your morning weight to track it next to your lifts.</div>`}
    </div>

    ${log.length ? `
    <div class="sec">Best sets</div>
    <div class="rows">${bests.map(b => `
      <div class="row">
        <div class="l">${esc(b.name)}<small>Last: ${b.last.weight_lb} × ${b.last.reps} · ${esc(shortDate(b.last.date))}</small></div>
        <div class="r">${b.trend} ${b.best.weight_lb} × ${b.best.reps}<small>${esc(shortDate(b.best.date))}</small></div>
      </div>`).join("")}
    </div>

    <div class="sec">Recent workouts</div>
    <div class="rows">${sessions.slice(-6).reverse().map(s => `
      <div class="row">
        <div class="l">${esc(s.workout)}<small>${esc(prettyDate(s.date))}</small></div>
        <div class="r">${s.sets} sets<small>${s.exercises.size} exercise${s.exercises.size === 1 ? "" : "s"}</small></div>
      </div>`).join("")}

    <div class="sec">Backup</div>
    <div class="card backup">
      <div class="last" style="margin-top:0">${Backup.last()
        ? `Last backup: <b>${esc(prettyDate(new Date(Backup.last()).toISOString().slice(0, 10)))}</b>`
        : `<b>No backup yet.</b> Save one to Files / iCloud Drive / Google Drive so your lifts survive a new phone.`}</div>
      <div class="row2">
        <button class="primary" id="bkSave">Back up now</button>
        <button class="secondary" id="bkLoad">Restore</button>
      </div>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
      <div class="msg" id="bkMsg"></div>
    </div>

    <div class="actions"><button class="secondary" id="back">← Back</button></div>
    <div class="small-actions">
      ${Install.available() ? `<button class="link" id="installLink">📲 Install app</button>` : ""}
      ${user ? `<button class="link" id="signOut">Sign out (${esc(user.email || "")})</button>`

  if ($("installLink")) $("installLink").onclick = () => Install.go();
  $("bkSave").onclick = async () => {

    if (saved) render();
  };
  $("bkLoad").onclick = () => $("bkFile").click();
  $("bkFile").onchange = async () => {
    const f = $("bkFile").files[0];
    if (!f) return;
    try {

  if ($("signIn")) $("signIn").onclick = () => { skipLogin = false; lsSet("lift-skip-login", false); render(); };
  wireRoutineSection();
}

  $("addWorkout").onclick = () => {
    RD.workouts.push({ name: `Workout ${RD.workouts.length + 1}`, days: [], blocks: [] });
    edW = RD.workouts.length - 1; go("workoutEdit");
  };
  $("setsDown").onclick = () => { RD.sets = Math.max(1, RD.sets - 1); render(); };
  $("setsUp").onclick = () => { RD.sets = Math.min(10, RD.sets + 1); render(); };
  $("rCancel").onclick = () => { RD = null; go("dashboard"); };
  $("rSave").onclick = () => {
    const msg = t => { $("rMsg").textContent = t; };
    if (!RD.name.trim()) return msg("Give your routine a name.");
    if (!RD.workouts.length) return msg("Add at least one workout.");
    const noEx = RD.workouts.find(w => !w.blocks.flat().length);
    if (noEx) return msg(`${noEx.name} needs at least one exercise.`);
    const noDay = RD.workouts.find(w => !w.days.length);
    if (noDay) return msg(`Pick at least one day for ${noDay.name}.`);
    const r = fixRoutine({ ...RD, id: RD.id || "r-" + uid() });
    if (!r) return msg("Something's missing. Check each workout has a name and exercises.");
    const i = STORE.custom.findIndex(c => c.id === r.id);
    if (i >= 0) STORE.custom[i] = r; else STORE.custom.push(r);
    STORE.selected = r.id;
    saveStore();
    state = fresh(0); save();
    RD = null; go("dashboard");
  };
}

// ---------------------------------------------------- exercise picker ------
function libraryGroups() {
  const groups = [];
  if (STORE.exercises.length) groups.push(["My exercises", STORE.exercises.map(e => e.n)]);
  Object.entries(EXERCISE_LIBRARY).forEach(([g, list]) => groups.push([g, list]));
  return groups;
}
function exerciseExists(name) {
  const n = name.trim().toLowerCase();
  return libraryGroups().some(([, list]) => list.some(x => x.toLowerCase() === n));
}
function addPicked(name) {
  const w = RD.workouts[edW];
  if (pickTarget && pickTarget.block !== null && w.blocks[pickTarget.block]) {
    const b = w.blocks[pickTarget.block];
    b.push(x(name, b[0].r || "10–12", ""));
  } else {
    w.blocks.push([x(name, "8–12", "")]);
  }
  pickTarget = null; pickQuery = "";
  go("workoutEdit");
}
function renderPicker() {
  const w = RD.workouts[edW];
  $("day").textContent = "Add exercise";
  $("sub").textContent = pickTarget && pickTarget.block !== null && w.blocks[pickTarget.block]

  };

  $("ownAdd").onclick = () => {

function updatePick() {
  $("pick").innerHTML = SLOTS.map((s, i) =>
    `<option value="${i}" ${i === state.slot ? "selected" : ""}>${esc(PLAN[s.w].name)}${s.d !== null ? ` (${DAY_SHORT[s.d]})` : ""}</option>`).join("");
}
function render() {
  Sync.show();
  updatePick();
  const editing = view === "routine" || view === "workoutEdit" || view === "exPick";
  document.querySelector("footer").style.display = editing ? "none" : "";
  if (CONFIGURED && sb && !user && !skipLogin) return renderLogin();
  if (view === "routine") return renderRoutineEditor();
  if (view === "workoutEdit") return renderWorkoutEditor();
  if (view === "exPick") return renderPicker();
  if (view === "dashboard") return renderDashboard();
  $("barwrap").style.display = "";
  const w = PLAN[state.day];

  const total = w.blocks.length;
  const doneCount = total - state.queue.length;

  $("day").textContent = w.name;
  $("bar").style.width = (doneCount / total * 100) + "%";
  $("undo").disabled = state.history.length === 0;


  if (state.queue.length === 0) {
    const nextSlot = (state.slot + 1) % SLOTS.length;
    const next = PLAN[SLOTS[nextSlot].w];
    const logged = Sets.all().filter(r => r.session_id === state.session).length;
    $("sub").textContent = `All ${total} done`;
    $("main").innerHTML = `
      <div class="card done">
        <div class="big">💪</div>
        <h2>${esc(w.name)} complete</h2>
        <p>${logged} sets logged</p>
        <p style="margin-top:6px">Next up: <b>${esc(next.name)}</b>${SLOTS[nextSlot].d !== null ? ` (${DAY_FULL[SLOTS[nextSlot].d]})` : ""}</p>
      </div>
      ${Backup.due() ? `<div class="nudge"><span>${Backup.last() ? "It's been over a week since your last backup." : "Back up your lifts so they survive a new phone."}</span><button class="primary" id="bkNudge">Back up</button></div>` : ""}
      <div class="actions">
        <button class="primary" id="nextDay">Start ${esc(next.name)}</button>
        <button class="secondary" id="dash">Dashboard</button>
      </div>`;
    $("dash").onclick = () => { view = "dashboard"; render(); window.scrollTo(0, 0); };
    if ($("bkNudge")) $("bkNudge").onclick = async () => { if (await Backup.save()) render(); };
    $("nextDay").onclick = () => { state = fresh(nextSlot); save(); render(); };
    return;
  }

  const idx = state.queue[0];
  const block = w.blocks[idx];
  const isPair = block.length > 1;
  const wasSkipped = state.skipped.includes(idx);
  const slotDay = SLOTS[state.slot] ? SLOTS[state.slot].d : null;
  $("sub").textContent = `${doneCount + 1} of ${total}${slotDay !== null ? " · " + DAY_FULL[slotDay] : ""}`;

  const upNext = state.queue.length > 1 ? blockTitle(w.blocks[state.queue[1]]) : null;

  $("main").innerHTML = `
    <div class="card">
      <span class="tag">${isPair ? "Superset · alternate" : "Straight sets"}</span>${wasSkipped ? '<span class="tag skipped">Skipped earlier</span>' : ""}
      ${block.map((e, ei) => {
        const last = lastTime(e.n, w.name);
        const rows = Array.from({ length: setsFor(e) }, (_, s) => {
          const d = state.draft[dkey(idx, ei, s + 1)] || {};
          const prev = last && last.sets.find(r => r.set_number === s + 1);
          return `
            <div class="set">
              <div class="set-label">Set ${s + 1}</div>
              <div class="field"><input type="number" inputmode="decimal" step="any" min="0"
                data-k="${dkey(idx, ei, s + 1)}" data-f="w" value="${esc(d.w ?? "")}"
                placeholder="${prev && prev.weight_lb != null ? prev.weight_lb : "0"}"><span>lb</span></div>
              <div class="x">×</div>
              <div class="field"><input type="number" inputmode="numeric" step="1" min="0"
                data-k="${dkey(idx, ei, s + 1)}" data-f="r" value="${esc(d.r ?? "")}"
                placeholder="${prev && prev.reps != null ? prev.reps : "0"}"><span>reps</span></div>
            </div>`;
        }).join("");
        return `
        <div class="ex">
          <div class="ex-name">${esc(e.n)}</div>
          <div class="ex-reps">${setsFor(e)} set${setsFor(e) === 1 ? "" : "s"} × ${esc(e.r)} reps</div>
          ${e.note ? `<div class="ex-note">${esc(e.note)}</div>` : ""}
          <div class="last">${last
            ? `Last ${esc(w.name)} (${esc(prettyDate(last.date))}): <b>${last.sets.map(r => `${r.weight_lb ?? "–"} lb × ${r.reps ?? "–"}`).join(" · ")}</b>`
            : `Last ${esc(w.name)}: <b>nothing logged yet</b>`}</div>
          <div class="sets">${rows}</div>
        </div>`;
      }).join("")}
    </div>
    ${upNext ? `<div class="next">Up next: <b>${esc(upNext)}</b></div>` : `<div class="next">Last one 🔥</div>`}
    <div class="actions">
      <button class="primary" id="finish">Finish ✓</button>
      <button class="secondary" id="skip" ${state.queue.length < 2 ? "disabled" : ""}>Machine busy, come back later →</button>
    </div>`;

  // Keep typed numbers in a draft so they survive skipping, closing the app, etc.
  document.querySelectorAll("input[data-k]").forEach(inp => {
    inp.oninput = () => {
      const k = inp.dataset.k;
      state.draft[k] = { ...(state.draft[k] || {}), [inp.dataset.f]: inp.value };
      save();
    };
  });

  $("finish").onclick = () => {
    const now = new Date().toISOString();
    const records = [];
    block.forEach((e, ei) => {
      for (let s = 1; s <= setsFor(e); s++) {
        const d = state.draft[dkey(idx, ei, s)] || {};
        const wt = d.w === undefined || d.w === "" ? null : Number(d.w);
        const rp = d.r === undefined || d.r === "" ? null : Math.round(Number(d.r));
        if (wt === null && rp === null) continue; // nothing entered for this set
        records.push({
          id: uid(), session_id: state.session, logged_at: now, date: localDate(),
          workout: w.name, exercise: e.n, set_number: s, weight_lb: wt, reps: rp,
        });
      }
    });
    snapshot({ logged: records.map(r => r.id) });
    block.forEach((e, ei) => { for (let s = 1; s <= setsFor(e); s++) delete state.draft[dkey(idx, ei, s)]; });
    state.queue.shift();
    save();
    if (records.length) Sets.add(records);
    render(); window.scrollTo(0, 0);
  };
  $("skip").onclick = () => {
    if (state.queue.length < 2) return;
    snapshot();
    const b = state.queue.shift();
    state.queue.push(b);
    if (!state.skipped.includes(b)) state.skipped.push(b);
    save(); render(); window.scrollTo(0, 0);
  };
}

// ------------------------------------------------------------ backup --------
// A backup is one .json file with every set, weigh-in, and the plan.
// On phones it opens the share sheet → "Save to Files" (iCloud Drive / Google Drive),
// so it survives deleting the app, clearing the browser, or a new phone.
const Backup = {
  KEY: "lift-last-backup",
  last: () => lsGet("lift-last-backup", null),
  due() {
    const hasData = Sets.all().length + Bodyweight.all().length > 0;
    const l = this.last();
    return hasData && (!l || Date.now() - l > 7 * 864e5);
  },
  build() {
    return { app: "lift", version: 1, exported_at: new Date().toISOString(),
             sets: Sets.all(), bodyweight: Bodyweight.all(), plan: lsGet(PLAN_KEY, null) };
  },
  download(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  },
  async save() {
    const name = `lift-backup-${localDate()}.json`;
    const blob = new Blob([JSON.stringify(this.build())], { type: "application/json" });
    let file = null;
    try { file = new File([blob], name, { type: "application/json" }); } catch (e) {}
    try {
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Lift backup" });
      } else {
        this.download(blob, name);
      }
    } catch (e) {
      if (e && e.name === "AbortError") return false;   // user closed the share sheet
      this.download(blob, name);
    }
    lsSet(this.KEY, Date.now());
    return true;
  },
  async restore(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { throw new Error("That isn't a Lift backup file."); }
    if (!data || data.app !== "lift" || !Array.isArray(data.sets)) throw new Error("That isn't a Lift backup file.");
    const okSet = r => r && typeof r.id === "string" && r.session_id && r.date && r.workout && r.exercise && r.set_number;
    const okBw = r => r && typeof r.id === "string" && r.date && Number(r.weight_lb) > 0;
    const haveS = new Set(Sets.all().map(r => r.id));
    const haveB = new Set(Bodyweight.all().map(r => r.id));
    const newS = data.sets.filter(okSet).filter(r => !haveS.has(r.id));
    const newB = (data.bodyweight || []).filter(okBw).filter(r => !haveB.has(r.id));
    if (newS.length) Sets.add(newS);
    if (newB.length) Bodyweight.add(newB);
    const incoming = normalizeStore(data.plan);
    if (incoming) {   // add their custom routines/exercises; keep anything already here
      const haveR = new Set(STORE.custom.map(r => r.id)), haveE = new Set(STORE.exercises.map(e => e.n.toLowerCase()));
      STORE.custom.push(...incoming.custom.filter(r => !haveR.has(r.id)));
      STORE.exercises.push(...incoming.exercises.filter(e => !haveE.has(e.n.toLowerCase())));
      if (!lsGet(PLAN_KEY, null)) STORE.selected = incoming.selected;
      saveStore();
    }
    return { sets: newS.length, bodyweight: newB.length,
             skipped: data.sets.length + (data.bodyweight || []).length - newS.length - newB.length };
  },
};
// Ask the browser not to auto-clear this app's data
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ------------------------------------------------------- install app --------
// Android/desktop Chrome: real install prompt. iPhone: Apple has no API for this,
// so the button shows the Share → "Add to Home Screen" steps instead.
const Install = {
  prompt: null,
  KEY: "lift-install-expanded",
  standalone: () => (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true,
  ios: () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1),
  available() { return !this.standalone() && (!!this.prompt || this.ios()); },
  // Starts open. × collapses it to a small square icon; tapping the square opens it again.
  refresh() {
    const avail = this.available(), collapsed = !lsGet(this.KEY, true);
    $("install").hidden = !avail || collapsed;
    $("installMiniWrap").hidden = !avail || !collapsed;
  },
  async go() {
    if (this.prompt) {
      this.prompt.prompt();
      const choice = await this.prompt.userChoice;
      this.prompt = null;
      if (choice && choice.outcome === "accepted") lsSet(this.KEY, false);
      this.refresh();
      return;
    }
    this.sheet();
  },
  sheet() {
    const notSafari = /crios|fxios|edgios/i.test(navigator.userAgent);
    $("sheetHost").innerHTML = `
      <div class="sheet-bg" id="sheetBg">
        <div class="sheet" onclick="event.stopPropagation()">
          <h3>Add Lift to your Home Screen</h3>
          <ol>
            <li>Tap <svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg> <b>Share</b> ${notSafari ? "in your browser's menu" : "at the bottom of Safari"}</li>
            <li>Scroll down, tap <b>Add to Home Screen</b></li>
            <li>Tap <b>Add</b></li>
          </ol>
          ${notSafari ? `<div class="hint">Easiest from Safari: open this page there first.</div>` : ""}
          <button class="primary" id="sheetOk">Got it</button>
        </div>
      </div>
      ${notSafari ? "" : `<div class="pointer">👇</div>`}`;
    const close = () => { $("sheetHost").innerHTML = ""; };
    $("sheetOk").onclick = close;
    $("sheetBg").onclick = close;
  },
};
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); Install.prompt = e; Install.refresh(); });
window.addEventListener("appinstalled", () => { Install.prompt = null; lsSet(Install.KEY, false); Install.refresh(); });
$("installGo").onclick = () => Install.go();
$("installX").onclick = () => { lsSet(Install.KEY, false); Install.refresh(); };
$("installMini").onclick = () => { lsSet(Install.KEY, true); Install.refresh(); };

// Offline support + makes Android treat it as an installable app
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("Service worker failed", e));
}

// ------------------------------------------------------------- start --------
state = load();
render();
initDb();
Install.refresh();
</script>
</body>
</html>
